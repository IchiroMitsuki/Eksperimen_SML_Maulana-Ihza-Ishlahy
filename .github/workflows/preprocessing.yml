name: Data Preprocessing Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run Automate Preprocessing Script
        run: |
          cd preprocessing
          python automate_Maulana-Ihza.py

      - name: Commit and Push Processed Data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/Japan_ImbalancePrice_preprocessing/
          git commit -m "Auto-generate preprocessed dataset [skip ci]" || echo "No changes to commit"
          git push
